<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>303-XMD | Link Device</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --error-bg: #451a03;
            --error-text: #f87171;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card);
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .logo span {
            color: var(--primary);
        }

        .subtitle {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 8px;
        }

        input[type="tel"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="tel"]:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background-color: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-box {
            background-color: var(--error-bg);
            color: var(--error-text);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 20px;
            display: none;
        }

        .success-box {
            display: none;
        }

        .code-display {
            background-color: #0f172a;
            border: 2px dashed var(--success);
            color: var(--success);
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 4px;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .instructions {
            font-size: 13px;
            color: var(--muted);
            text-align: left;
            background-color: #0f172a;
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
            line-height: 1.6;
        }

        .instructions b {
            color: var(--text);
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- FORM VIEW -->
        <div id="form-view">
            <div class="logo">303<span>-XMD</span></div>
            <div class="subtitle">Link your WhatsApp device</div>

            <div class="form-group">
                <label>WhatsApp Number (with country code)</label>
                <input type="tel" id="phoneNumber" placeholder="e.g. 254712345678" maxlength="15">
            </div>

            <button id="pairBtn">Get Pairing Code</button>
            
            <div id="errorBox" class="error-box"></div>
        </div>

        <!-- SUCCESS VIEW -->
        <div id="success-view" class="success-box">
            <div class="logo" style="color:var(--success)">Code Ready</div>
            <div class="subtitle">Enter this on your phone</div>
            
            <div id="pairingCode" class="code-display">----</div>
            
            <div class="instructions">
                <b>How to link:</b><br>
                1. Open WhatsApp on your phone.<br>
                2. Go to <b>Linked Devices</b>.<br>
                3. Tap <b>Link with Phone Number</b>.<br>
                4. Enter the code above.
            </div>

            <button id="resetBtn" style="margin-top: 20px; background-color: transparent; border: 1px solid #334155;">
                Pair another device
            </button>
        </div>
    </div>

    <script>
        const pairBtn = document.getElementById('pairBtn');
        const phoneNumber = document.getElementById('phoneNumber');
        const errorBox = document.getElementById('errorBox');
        const formView = document.getElementById('form-view');
        const successView = document.getElementById('success-view');
        const pairingCode = document.getElementById('pairingCode');
        const resetBtn = document.getElementById('resetBtn');

        pairBtn.addEventListener('click', async () => {
            const num = phoneNumber.value.replace(/\D/g, '');
            
            if (num.length < 10 || num.length > 15) {
                showError("Please enter a valid number with country code.");
                return;
            }

            // Reset UI
            errorBox.style.display = 'none';
            pairBtn.disabled = true;
            pairBtn.innerHTML = '<div class="spinner"></div> Generating...';

            // Generate a random session ID for this pairing
            const sessionId = 'sess_' + Math.random().toString(36).slice(2, 10);

            try {
                // Note: The URL is /api/pair to match the new index.js
                const response = await fetch('/api/pair', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId, num })
                });

                const data = await response.json();

                // Check if the server returned an error
                if (!response.ok || data.error) {
                    throw new Error(data.error || "Failed to generate code");
                }

                // Show success view
                formView.style.display = 'none';
                successView.style.display = 'block';
                pairingCode.textContent = data.code;

            } catch (err) {
                showError(err.message);
                pairBtn.disabled = false;
                pairBtn.innerHTML = 'Get Pairing Code';
            }
        });

        resetBtn.addEventListener('click', () => {
            phoneNumber.value = '';
            formView.style.display = 'block';
            successView.style.display = 'none';
            pairBtn.disabled = false;
            pairBtn.innerHTML = 'Get Pairing Code';
            errorBox.style.display = 'none';
        });

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }

        // Allow pressing "Enter" to submit
        phoneNumber.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') pairBtn.click();
        });
    </script>
</body>
</html>
