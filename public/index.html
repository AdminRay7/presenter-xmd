<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>303-XMD | Pair Device</title>
    <style>
        :root {
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --primary: #10b981;
            --primary-hover: #059669;
            --border: #e5e7eb;
            --error: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card);
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 40px 30px;
            text-align: center;
        }

        .logo {
            font-size: 40px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text);
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #f9fafb;
        }

        input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: var(--primary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover { background: var(--primary-hover); }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.7; cursor: not-allowed; }

        .code-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #ecfdf5;
            border: 1px dashed var(--primary);
            border-radius: 12px;
        }

        .code-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .code-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-hover);
            letter-spacing: 4px;
            font-family: monospace;
        }

        .error {
            color: var(--error);
            font-size: 14px;
            margin-top: 15px;
            display: none;
            background: #fef2f2;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">🤖</div>
        <h1>303-XMD</h1>
        <p class="subtitle">Enter your WhatsApp number to link</p>

        <div class="input-group">
            <label>Phone Number</label>
            <input id="phone" type="tel" placeholder="e.g. 254794376595" autocomplete="off" />
        </div>

        <button id="btn" onclick="pair()">Get Pairing Code</button>

        <div id="codeBox" class="code-box">
            <div class="code-label">Your Pairing Code</div>
            <div id="codeValue" class="code-value">----</div>
        </div>

        <div id="err" class="error"></div>
    </div>

<script>
async function pair() {
    const btn = document.getElementById("btn");
    const phone = document.getElementById("phone").value.trim();
    const err = document.getElementById("err");
    const codeBox = document.getElementById("codeBox");
    const codeValue = document.getElementById("codeValue");

    // Reset UI
    err.style.display = "none";
    codeBox.style.display = "none";

    if (!phone) {
        err.textContent = "Please enter your phone number.";
        err.style.display = "block";
        return;
    }

    // Disable button while loading
    btn.disabled = true;
    btn.textContent = "Generating...";

    try {
        // Automatically generates a random session ID in the background
        const sessionId = "sess_" + Math.random().toString(36).substring(2, 15);

        const r = await fetch("/pair", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionId, phone })
        });
        
        const j = await r.json();
        
        if (!r.ok) throw new Error(j.error || "Failed to generate code");

        // Show code
        codeValue.textContent = j.code;
        codeBox.style.display = "block";
        btn.textContent = "Code Generated ✓";
        
    } catch (e) {
        err.textContent = e.message;
        err.style.display = "block";
        btn.textContent = "Get Pairing Code";
        btn.disabled = false;
    }
}
</script>
</body>
</html>
